<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Card Animation</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 40px;
            color: #333;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            overflow: hidden;
        }

        .card {
            width: 280px;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px gray;

            /* Starting position */
            transform: translateX(-500px);

            /* Animation */
            animation: slideIn 1s forwards;
        }

        /* Different animation delays */
        .card:nth-child(2) {
            animation-delay: 0.5s;
        }

        .card:nth-child(3) {
            animation-delay: 1s;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .card p {
            color: #666;
            line-height: 1.5;
        }

        /* Sliding Animation */
        @keyframes slideIn {
            from {
                transform: translateX(-500px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Hover effect */
        .card:hover {
            transform: translateY(-10px);
            transition: transform 0.3s;
        }
    </style>
</head>

<body>

    <h1>Sliding Image Cards</h1>

    <div class="card-container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=80"
                 alt="Mountain">

            <div class="card-content">
                <h2>Mountain</h2>
                <p>Beautiful mountain scenery with a peaceful environment.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80"
                 alt="Beach">

            <div class="card-content">
                <h2>Beach</h2>
                <p>Enjoy the relaxing view of the sea and beautiful beach.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80"
                 alt="Nature">

            <div class="card-content">
                <h2>Nature</h2>
                <p>Explore beautiful natural landscapes and fresh surroundings.</p>
            </div>
        </div>

    </div>

</body>
</html>

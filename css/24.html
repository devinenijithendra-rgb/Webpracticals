<!DOCTYPE html>
<html>
<head>
    <title>Styled Navigation Bar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #333;
            overflow: hidden;
        }

        /* Navigation Links */
        .navbar a {
            float: left;
            color: white;
            text-decoration: none;
            padding: 18px 25px;
            font-size: 18px;
        }

        /* Hover Effect */
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        /* Active Link */
        .navbar a.active {
            background-color: green;
            color: white;
        }

        /* Page Content */
        .content {
            text-align: center;
            padding: 50px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="#" class="active">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>

    <div class="content">
        <h1>Welcome to My Website</h1>
        <p>This webpage demonstrates a styled navigation bar using CSS.</p>
    </div>

</body>
</html>

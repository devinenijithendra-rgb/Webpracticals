<!DOCTYPE html>
<html>
<head>
    <title>CSS Flexbox Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: #333;
            padding: 20px;
        }

        /* Flex Container */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 30px;
            flex-wrap: wrap;
        }

        /* Flex Items */
        .box {
            width: 200px;
            height: 150px;
            background-color: #ffffff;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .box:hover {
            background-color: #ddd;
        }

        /* Navigation using Flexbox */
        .navbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #333;
            padding: 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
        }

        .navbar a:hover {
            background-color: #555;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>CSS Flexbox Example</h1>

    <!-- Flexbox Navigation -->
    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>

    <!-- Flexbox Container -->
    <div class="container">

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>

    </div>

</body>
</html>

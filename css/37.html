<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        /* Page Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Box */
        .login-box {
            width: 350px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        /* Heading */
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        /* Labels */
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        /* Input Fields */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
        }

        /* Input Focus */
        input:focus {
            border-color: #333;
            outline: none;
        }

        /* Remember Me */
        .remember {
            margin-bottom: 20px;
        }

        .remember input {
            margin-right: 5px;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #555;
        }

        /* Links */
        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #333;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media screen and (max-width: 400px) {
            .login-box {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Login</h1>

        <form>

            <label for="username">Username</label>
            <input type="text" id="username"
                   placeholder="Enter your username">

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Enter your password">

            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember" style="display: inline;">
                    Remember Me
                </label>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <div class="links">
                <p><a href="#">Forgot Password?</a></p>
                <p><a href="#">Create an Account</a></p>
            </div>

        </form>

    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navigation Menu</title>

    <style>
        /* Page Styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        /* Logo */
        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links li {
            margin-left: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }

        .nav-links a:hover {
            background-color: #555;
            border-radius: 5px;
        }

        /* Content */
        .content {
            text-align: center;
            padding: 80px 20px;
        }

        .content h1 {
            color: #333;
        }

        /* Responsive Design */
        @media screen and (max-width: 600px) {

            .navbar {
                flex-direction: column;
                padding: 15px;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
                text-align: center;
                margin-top: 10px;
            }

            .nav-links li {
                margin: 0;
                border-top: 1px solid #555;
            }

            .nav-links a {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Menu -->
    <nav class="navbar">

        <div class="logo">
            MyWebsite
        </div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>

    <!-- Main Content -->
    <div class="content">
        <h1>Responsive Navigation Menu</h1>
        <p>Resize the browser window to see the responsive design.</p>
    </div>

</body>
</html>

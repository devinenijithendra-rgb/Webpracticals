<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Only Modal Popup</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        p {
            margin-bottom: 30px;
            color: #555;
        }

        /* Open Button */
        .open-btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
        }

        .open-btn:hover {
            background-color: #0056b3;
        }

        /* Modal Background */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.6);

            justify-content: center;
            align-items: center;
        }

        /* Show Modal */
        .modal:target {
            display: flex;
        }

        /* Modal Box */
        .modal-content {
            width: 400px;
            max-width: 90%;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);

            animation: popup 0.4s ease;
        }

        .modal-content h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .modal-content p {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Close Button */
        .close-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .close-btn:hover {
            background-color: #a71d2a;
        }

        /* Popup Animation */
        @keyframes popup {
            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <h1>CSS-Only Modal Popup</h1>

    <p>Click the button below to open the popup.</p>

    <!-- Open Modal -->
    <a href="#myModal" class="open-btn">Open Popup</a>

    <!-- Modal -->
    <div id="myModal" class="modal">

        <div class="modal-content">

            <h2>Welcome!</h2>

            <p>
                This is a modal popup created using only
                HTML and CSS. No JavaScript is required.
            </p>

            <!-- Close Modal -->
            <a href="#" class="close-btn">Close</a>

        </div>

    </div>

</body>
</html>

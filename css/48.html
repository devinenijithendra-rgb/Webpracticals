<!DOCTYPE html>

<html>
<head>
    <title>Border Radius Shapes</title>

```
<style>

    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        text-align: center;
        margin: 0;
    }

    h1 {
        background-color: #333;
        color: white;
        padding: 20px;
        margin: 0;
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 40px;
        padding: 40px;
    }

    .shape {
        width: 150px;
        height: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        border: 3px solid black;
    }

    /* Rounded Rectangle */
    .rounded {
        border-radius: 20px;
        background-color: lightblue;
    }

    /* Circle */
    .circle {
        border-radius: 50%;
        background-color: lightgreen;
    }

    /* Pill Shape */
    .pill {
        width: 200px;
        height: 100px;
        border-radius: 50px;
        background-color: orange;
    }

    /* Oval */
    .oval {
        width: 200px;
        height: 120px;
        border-radius: 50%;
        background-color: pink;
    }

    /* Elliptical Shape */
    .ellipse {
        width: 250px;
        height: 100px;
        border-radius: 50%;
        background-color: violet;
    }

    /* Custom Shape */
    .custom {
        border-radius: 10px 50px 10px 50px;
        background-color: gold;
    }

</style>
```

</head>

<body>

```
<h1>CSS Border-Radius Shapes</h1>

<div class="container">

    <div class="shape rounded">
        Rounded Rectangle
    </div>

    <div class="shape circle">
        Circle
    </div>

    <div class="shape pill">
        Pill
    </div>

    <div class="shape oval">
        Oval
    </div>

    <div class="shape ellipse">
        Ellipse
    </div>

    <div class="shape custom">
        Custom Shape
    </div>

</div>
```

</body>
</html>

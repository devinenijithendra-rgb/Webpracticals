<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
            text-align: center;
        }

        .box {
            width: 300px;
            height: 150px;

            padding: 30px;
            border: 5px solid blue;

            margin: 50px auto;

            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model Demonstration</h1>

    <div class="box">
        <h2>Content</h2>
        <p>This is the content area.</p>
        <p>Padding, Border and Margin are applied around it.</p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Login and Signup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Main Container */
        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* Forms Container */
        .forms {
            width: 900px;
            max-width: 100%;
            display: flex;
            gap: 25px;
        }

        /* Form Card */
        .form-box {
            flex: 1;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .form-box h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Labels */
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        /* Input Fields */
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        /* Buttons */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Extra Text */
        .text {
            text-align: center;
            margin-top: 18px;
            color: #555;
        }

        .text a {
            color: #007bff;
            text-decoration: none;
        }

        .text a:hover {
            text-decoration: underline;
        }

        /* Mobile Responsive */
        @media (max-width: 700px) {
            .forms {
                flex-direction: column;
            }

            .container {
                padding: 20px;
            }

            .form-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="forms">

            <!-- Login Form -->
            <div class="form-box">
                <h2>Login</h2>

                <form>
                    <label for="login-email">Email</label>
                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="login-password">Password</label>
                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit">Login</button>

                    <p class="text">
                        Forgot your password?
                        <a href="#">Reset Password</a>
                    </p>
                </form>
            </div>

            <!-- Signup Form -->
            <div class="form-box">
                <h2>Sign Up</h2>

                <form>
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                    <label for="signup-email">Email</label>
                    <input
                        type="email"
                        id="signup-email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="signup-password">Password</label>
                    <input
                        type="password"
                        id="signup-password"
                        placeholder="Create a password"
                        required
                    >

                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                    <button type="submit">Sign Up</button>

                    <p class="text">
                        Already have an account?
                        <a href="#">Login</a>
                    </p>
                </form>
            </div>

        </div>

    </div>

</body>
</html>

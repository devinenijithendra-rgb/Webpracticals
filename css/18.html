<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors, Backgrounds and Borders</title>

    <style>
        h1 {
            color: blue;
        }

        .text {
            color: green;
            font-size: 20px;
        }

        body {
            background-color: lightgray;
        }

        .box {
            background-color: lightyellow;
            padding: 20px;
            margin: 20px;
        }

        .border1 {
            border: 3px solid red;
            padding: 15px;
            margin: 10px;
        }

        .border2 {
            border: 3px dashed blue;
            padding: 15px;
            margin: 10px;
        }

        .border3 {
            border: 3px dotted green;
            padding: 15px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Colors, Backgrounds and Borders</h1>

    <p class="text">
        This text demonstrates CSS colors.
    </p>

    <div class="box">
        This section demonstrates background color.
    </div>

    <div class="border1">
        Solid Border
    </div>

    <div class="border2">
        Dashed Border
    </div>

    <div class="border3">
        Dotted Border
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        /* Gallery container */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        /* Gallery images */
        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            transition: transform 0.3s;
        }

        /* Hover effect */
        .gallery img:hover {
            transform: scale(1.05);
        }

        /* Tablet */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Image Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
        <img src="https://picsum.photos/id/1016/600/400" alt="Nature">
        <img src="https://picsum.photos/id/1018/600/400" alt="Landscape">
        <img src="https://picsum.photos/id/1025/600/400" alt="Dog">
        <img src="https://picsum.photos/id/1035/600/400" alt="River">
        <img src="https://picsum.photos/id/1043/600/400" alt="Forest">
        <img src="https://picsum.photos/id/1069/600/400" alt="Beach">
        <img src="https://picsum.photos/id/1074/600/400" alt="Waterfall">

    </div>

</body>
</html>

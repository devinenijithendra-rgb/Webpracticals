<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Contact Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Main Container */
        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* Contact Form */
        .contact-form {
            width: 700px;
            max-width: 100%;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .contact-form h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .contact-form .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* Form Row */
        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }

        /* Labels */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* Inputs */
        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        /* Submit Button */
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .contact-form {
                padding: 25px 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <form class="contact-form">

            <h1>Contact Us</h1>

            <p class="description">
                Fill out the form below and we will get back to you soon.
            </p>

            <!-- Name and Email -->
            <div class="form-row">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

            </div>

            <!-- Phone and Subject -->
            <div class="form-row">

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                    >
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject">
                        <option value="">Select a subject</option>
                        <option value="general">General Enquiry</option>
                        <option value="support">Technical Support</option>
                        <option value="feedback">Feedback</option>
                    </select>
                </div>

            </div>

            <!-- Message -->
            <div class="form-group">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    placeholder="Enter your message"
                    required
                ></textarea>
            </div>

            <!-- Submit -->
            <button type="submit">Send Message</button>

        </form>

    </div>

</body>
</html>

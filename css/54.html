<!DOCTYPE html>

<html>
<head>
    <title>Dropdown Menu</title>

```
<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    /* Navigation Bar */
    .navbar {
        background-color: #333;
        display: flex;
        justify-content: center;
    }

    .navbar a,
    .dropdown-btn {
        color: white;
        padding: 16px 20px;
        text-decoration: none;
        display: block;
        border: none;
        background-color: #333;
        font-size: 16px;
        cursor: pointer;
    }

    .navbar a:hover,
    .dropdown:hover .dropdown-btn {
        background-color: #555;
    }

    /* Dropdown Container */
    .dropdown {
        position: relative;
    }

    /* Dropdown Content */
    .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 180px;
        background-color: white;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        z-index: 1;
    }

    /* Dropdown Links */
    .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
    }

    .dropdown-content a:hover {
        background-color: #ddd;
    }

    /* Show Dropdown on Hover */
    .dropdown:hover .dropdown-content {
        display: block;
    }

    /* Page Content */
    .content {
        text-align: center;
        padding: 60px;
    }

</style>
```

</head>

<body>

```
<!-- Navigation Bar -->
<div class="navbar">

    <a href="#">Home</a>

    <div class="dropdown">

        <button class="dropdown-btn">
            Courses ▼
        </button>

        <div class="dropdown-content">
            <a href="#">HTML</a>
            <a href="#">CSS</a>
            <a href="#">JavaScript</a>
            <a href="#">Python</a>
        </div>

    </div>

    <a href="#">About</a>
    <a href="#">Contact</a>

</div>

<!-- Page Content -->
<div class="content">

    <h1>Welcome to My Website</h1>

    <p>
        Hover over the <b>Courses</b> menu to see the dropdown.
    </p>

</div>
```

</body>
</html>

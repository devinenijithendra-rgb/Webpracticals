<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Types Demonstration</title>

    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: blue;
        }

        .internal {
            color: green;
            font-size: 20px;
        }
    </style>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Types Demonstration</h1>

    <p style="color: red; font-size: 22px;">
        This paragraph uses Inline CSS.
    </p>

    <p class="internal">
        This paragraph uses Internal CSS.
    </p>

    <p class="external">
        This paragraph uses External CSS.
    </p>

</body>
</html>

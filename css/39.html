<!DOCTYPE html>
<html>
<head>
    <title>Responsive Photo Gallery</title>

    <style>
        /* General Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin: auto;
        }

        /* Gallery Images */
        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            transition: transform 0.3s;
        }

        /* Hover Effect */
        .gallery img:hover {
            transform: scale(1.05);
        }

        /* Tablet */
        @media screen and (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media screen and (max-width: 500px) {
            body {
                padding: 15px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/500/400?random=1"
             alt="Gallery Image 1">

        <img src="https://picsum.photos/500/400?random=2"
             alt="Gallery Image 2">

        <img src="https://picsum.photos/500/400?random=3"
             alt="Gallery Image 3">

        <img src="https://picsum.photos/500/400?random=4"
             alt="Gallery Image 4">

        <img src="https://picsum.photos/500/400?random=5"
             alt="Gallery Image 5">

        <img src="https://picsum.photos/500/400?random=6"
             alt="Gallery Image 6">

        <img src="https://picsum.photos/500/400?random=7"
             alt="Gallery Image 7">

        <img src="https://picsum.photos/500/400?random=8"
             alt="Gallery Image 8">

    </div>

</body>
</html>

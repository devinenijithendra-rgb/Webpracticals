<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Keyframe Animations</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 40px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 50px;
        }

        /* Moving Box */
        .box {
            width: 120px;
            height: 120px;
            background-color: royalblue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;

            animation: moveBox 3s infinite alternate;
        }

        @keyframes moveBox {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(150px);
            }
        }

        /* Rotating Circle */
        .circle {
            width: 120px;
            height: 120px;
            background-color: orange;
            border-radius: 50%;

            animation: rotateCircle 2s linear infinite;
        }

        @keyframes rotateCircle {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Color Changing Box */
        .color-box {
            width: 120px;
            height: 120px;
            background-color: red;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;

            animation: changeColor 4s infinite;
        }

        @keyframes changeColor {
            0% {
                background-color: red;
            }

            25% {
                background-color: blue;
            }

            50% {
                background-color: green;
            }

            75% {
                background-color: purple;
            }

            100% {
                background-color: red;
            }
        }

        /* Bouncing Ball */
        .ball {
            width: 80px;
            height: 80px;
            background-color: seagreen;
            border-radius: 50%;

            animation: bounce 1s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-100px);
            }
        }

        /* Animated Text */
        .text {
            margin-top: 60px;
            font-size: 30px;
            font-weight: bold;

            animation: textAnimation 2s infinite alternate;
        }

        @keyframes textAnimation {
            from {
                opacity: 0.3;
                transform: scale(1);
            }

            to {
                opacity: 1;
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <h1>CSS Keyframe Animations</h1>

    <div class="container">

        <div class="box">
            Moving
        </div>

        <div class="circle"></div>

        <div class="color-box">
            Color
        </div>

        <div class="ball"></div>

    </div>

    <div class="text">
        Animated Text
    </div>

</body>
</html>

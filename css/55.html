<!DOCTYPE html>

<html>
<head>
    <title>Image Hover Effects</title>

```
<style>

    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        text-align: center;
        margin: 0;
        padding: 30px;
    }

    h1 {
        color: #333;
    }

    .gallery {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 30px;
        margin-top: 40px;
    }

    .image-box {
        width: 250px;
        height: 180px;
        overflow: hidden;
        border: 3px solid #333;
        border-radius: 10px;
    }

    .image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: 0.5s ease;
    }

    /* 1. Zoom Effect */
    .zoom:hover img {
        transform: scale(1.2);
    }

    /* 2. Grayscale Effect */
    .gray:hover img {
        filter: grayscale(100%);
    }

    /* 3. Brightness Effect */
    .bright:hover img {
        filter: brightness(1.5);
    }

    /* 4. Rotate Effect */
    .rotate:hover img {
        transform: rotate(10deg) scale(1.1);
    }

    /* 5. Blur Effect */
    .blur:hover img {
        filter: blur(3px);
    }

</style>
```

</head>

<body>

```
<h1>CSS Image Hover Effects</h1>

<div class="gallery">

    <!-- Zoom -->
    <div class="image-box zoom">
        <img src="https://picsum.photos/id/1015/400/300" alt="Nature">
    </div>

    <!-- Grayscale -->
    <div class="image-box gray">
        <img src="https://picsum.photos/id/1016/400/300" alt="Mountain">
    </div>

    <!-- Brightness -->
    <div class="image-box bright">
        <img src="https://picsum.photos/id/1025/400/300" alt="Animal">
    </div>

    <!-- Rotate -->
    <div class="image-box rotate">
        <img src="https://picsum.photos/id/1035/400/300" alt="Landscape">
    </div>

    <!-- Blur -->
    <div class="image-box blur">
        <img src="https://picsum.photos/id/1040/400/300" alt="Nature">
    </div>

</div>
```

</body>
</html>

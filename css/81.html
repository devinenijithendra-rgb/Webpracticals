<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D and 3D CSS Transformations</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 40px;
        }

        h2 {
            margin: 25px 0;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .box {
            width: 150px;
            height: 150px;
            background-color: steelblue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-size: 18px;
            transition: transform 0.6s;
        }

        /* 2D Transformations */

        .translate:hover {
            transform: translate(30px, 20px);
        }

        .rotate:hover {
            transform: rotate(45deg);
        }

        .scale:hover {
            transform: scale(1.3);
        }

        .skew:hover {
            transform: skew(20deg, 10deg);
        }

        /* 3D Transformations */

        .perspective {
            perspective: 500px;
        }

        .rotate-x:hover {
            transform: rotateX(60deg);
        }

        .rotate-y:hover {
            transform: rotateY(60deg);
        }

        .rotate-z:hover {
            transform: rotateZ(45deg);
        }

        .scale-3d:hover {
            transform: scale3d(1.3, 1.3, 1.3);
        }

        .green {
            background-color: seagreen;
        }

        .orange {
            background-color: orange;
        }
    </style>
</head>

<body>

    <h1>2D and 3D CSS Transformations</h1>

    <h2>2D Transformations</h2>

    <div class="container">

        <div class="box translate">
            Translate
        </div>

        <div class="box rotate">
            Rotate
        </div>

        <div class="box scale">
            Scale
        </div>

        <div class="box skew">
            Skew
        </div>

    </div>

    <h2>3D Transformations</h2>

    <div class="container">

        <div class="perspective">
            <div class="box green rotate-x">
                Rotate X
            </div>
        </div>

        <div class="perspective">
            <div class="box green rotate-y">
                Rotate Y
            </div>
        </div>

        <div class="perspective">
            <div class="box orange rotate-z">
                Rotate Z
            </div>
        </div>

        <div class="perspective">
            <div class="box orange scale-3d">
                Scale 3D
            </div>
        </div>

    </div>

</body>
</html>

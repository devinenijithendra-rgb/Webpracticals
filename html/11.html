<!DOCTYPE html>
<html>
<head>
    <title>Internal and External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            text-align: center;
            font-family: Arial;
        }

        .internal {
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Internal and External CSS</h1>

    <p class="internal">
        This paragraph is styled using Internal CSS.
    </p>

    <p class="external">
        This paragraph is styled using External CSS.
    </p>

    <div class="box">
        <h2>Welcome to My Webpage</h2>
        <p>
            CSS is used to style and design HTML webpages.
        </p>
    </div>

</body>
</html>

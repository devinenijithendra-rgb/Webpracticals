<!DOCTYPE html>
<html>
<head>
    <title>Webpage Using Iframes</title>
</head>
<body>

    <h1>My Webpage Using Iframes</h1>

    <p>This webpage demonstrates the use of iframe elements.</p>

    <h2>Google</h2>
    <iframe 
        src="https://www.google.com"
        width="600"
        height="300"
        title="Google">
    </iframe>

    <h2>YouTube</h2>
    <iframe 
        width="600"
        height="300"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube Video"
        allowfullscreen>
    </iframe>

    <h2>Local HTML Page</h2>
    <iframe 
        src="page2.html"
        width="600"
        height="300"
        title="Local Webpage">
    </iframe>

</body>
</html>

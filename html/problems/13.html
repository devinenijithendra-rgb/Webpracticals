<!DOCTYPE html>
<html>
<head>
    <title>Responsive Webpage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Header */
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* Navigation */
        nav {
            background-color: #555;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 25px;
        }

        nav a:hover {
            background-color: #222;
        }

        /* Main content */
        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .box {
            background-color: white;
            padding: 25px;
            flex: 1;
            border: 2px solid #ddd;
            text-align: center;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* Tablet */
        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            nav a {
                padding: 12px;
            }
        }

        /* Mobile */
        @media screen and (max-width: 480px) {
            header h1 {
                font-size: 24px;
            }

            nav {
                flex-direction: column;
                text-align: center;
            }

            nav a {
                border-bottom: 1px solid #777;
            }

            .container {
                padding: 15px;
            }

            .box {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Responsive Webpage</h1>
        <p>Resize the browser window to see the changes.</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>
                HTML is used to create the structure of webpages.
            </p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>
                CSS is used to style and design webpages.
            </p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>
                JavaScript is used to make webpages interactive.
            </p>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 My Responsive Webpage</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>CSS Properties and Selectors</title>

    <style>
        /* Element Selector */
        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* ID Selector */
        #heading {
            color: darkblue;
            text-align: center;
            font-size: 32px;
        }

        /* Class Selector */
        .paragraph {
            color: darkgreen;
            font-size: 18px;
            margin: 15px;
            padding: 10px;
            border: 2px solid green;
        }

        /* Group Selector */
        h2, h3 {
            color: purple;
            font-family: Georgia, serif;
        }

        /* Box styling */
        .box {
            background-color: white;
            border: 3px solid black;
            margin: 30px;
            padding: 20px;
            width: 400px;
        }

        /* Descendant Selector */
        .box p {
            color: brown;
            font-family: Verdana, sans-serif;
        }
    </style>
</head>

<body>

    <h1 id="heading">CSS Selectors and Properties</h1>

    <h2>About CSS</h2>

    <p class="paragraph">
        CSS stands for Cascading Style Sheets. It is used to style
        and design HTML webpages.
    </p>

    <h3>CSS Box Model</h3>

    <div class="box">
        <p>
            This box demonstrates margins, padding, borders,
            colors, and fonts using CSS.
        </p>
    </div>

</body>
</html>

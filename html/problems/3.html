<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

    <h1>Student Information</h1>

    <table border="1" cellpadding="10" cellspacing="0">
        
        <!-- Merged cell using colspan -->
        <tr>
            <th colspan="4">Student Details</th>
        </tr>

        <tr>
            <th>Roll No.</th>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>B.Tech</td>
            <td>85</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Priya</td>
            <td>B.Tech</td>
            <td>90</td>
        </tr>

        <!-- Merged cells using rowspan -->
        <tr>
            <td rowspan="2">103</td>
            <td rowspan="2">Arjun</td>
            <td>HTML</td>
            <td>88</td>
        </tr>

        <tr>
            <td>CSS</td>
            <td>92</td>
        </tr>

        <!-- Merged cells using colspan -->
        <tr>
            <td colspan="3"><b>Total Students</b></td>
            <td><b>3</b></td>
        </tr>

    </table>

</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Positive Negative Zero</title></head><body><h2>Check a Number</h2><input id="n" type="number"><button onclick="check()">Check</button><p id="result"></p><script>function check(){const n=+document.getElementById("n").value;document.getElementById("result").textContent=n>0?"Positive":n<0?"Negative":"Zero";}</script></body></html>

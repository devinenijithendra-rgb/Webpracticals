<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Multiplication Table</title></head><body><h2>Multiplication Table</h2><input id="n" type="number" placeholder="Number"><button onclick="table()">Generate</button><pre id="result"></pre><script>function table(){const n=+document.getElementById("n").value;let s="";for(let i=1;i<=10;i++)s+=`${n} × ${i} = ${n*i}\n`;document.getElementById("result").textContent=s;}</script></body></html>

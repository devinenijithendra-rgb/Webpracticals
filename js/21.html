<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>To-Do List</title></head><body><h2>To-Do List</h2><input id="task" placeholder="Enter task"><button onclick="add()">Add</button><ul id="list"></ul><script>function add(){const input=document.getElementById("task");if(!input.value.trim())return;const li=document.createElement("li");li.textContent=input.value+" ";const b=document.createElement("button");b.textContent="Done";b.onclick=()=>li.remove();li.appendChild(b);document.getElementById("list").appendChild(li);input.value="";}</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Largest of Three</title></head><body><h2>Largest of Three Numbers</h2><input id="a" type="number"><input id="b" type="number"><input id="c" type="number"><button onclick="findLargest()">Find Largest</button><p id="result"></p><script>function findLargest(){let a=+document.getElementById("a").value,b=+document.getElementById("b").value,c=+document.getElementById("c").value;document.getElementById("result").textContent="Largest = "+Math.max(a,b,c);}</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Sum of Digits</title></head><body><h2>Sum of Digits</h2><input id="n" type="number"><button onclick="sumDigits()">Calculate</button><p id="result"></p><script>function sumDigits(){let n=Math.abs(Math.trunc(+document.getElementById("n").value)),s=0;while(n){s+=n%10;n=Math.floor(n/10)}document.getElementById("result").textContent="Sum = "+s;}</script></body></html>

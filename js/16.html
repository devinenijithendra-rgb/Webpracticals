<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Guessing Game</title></head><body><h2>Number Guessing Game (1–100)</h2><input id="guess" type="number"><button onclick="guessNumber()">Guess</button><p id="result"></p><script>let secret=Math.floor(Math.random()*100)+1;function guessNumber(){const g=+document.getElementById("guess").value;document.getElementById("result").textContent=g===secret?"Correct! 🎉":g<secret?"Too low":"Too high";}</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Even or Odd</title></head><body><h2>Even or Odd</h2><input id="n" type="number" placeholder="Enter number"><button onclick="check()">Check</button><p id="result"></p><script>function check(){const n=Number(document.getElementById("n").value);document.getElementById("result").textContent=n%2===0?"Even number":"Odd number";}</script></body></html>

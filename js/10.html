<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Palindrome Checker</title></head><body><h2>Palindrome Checker</h2><input id="text" placeholder="Enter text"><button onclick="check()">Check</button><p id="result"></p><script>function check(){const s=document.getElementById("text").value.toLowerCase().replace(/[^a-z0-9]/g,"");document.getElementById("result").textContent=s===s.split("").reverse().join("")?"Palindrome":"Not a palindrome";}</script></body></html>

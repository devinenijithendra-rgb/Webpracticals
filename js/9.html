<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Factorial</title></head><body><h2>Factorial</h2><input id="n" type="number" min="0"><button onclick="fact()">Find</button><p id="result"></p><script>function fact(){const n=+document.getElementById("n").value;let f=1;for(let i=2;i<=n;i++)f*=i;document.getElementById("result").textContent=`${n}! = ${f}`;}</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Stopwatch</title></head><body><h2>Stopwatch</h2><h1 id="time">0.0</h1><button onclick="start()">Start</button><button onclick="stop()">Stop</button><button onclick="reset()">Reset</button><script>let t=0,id=null;function render(){document.getElementById("time").textContent=(t/10).toFixed(1)}function start(){if(id===null)id=setInterval(()=>{t++;render()},100)}function stop(){clearInterval(id);id=null}function reset(){stop();t=0;render()}</script></body></html>

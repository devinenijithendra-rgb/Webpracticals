<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Prime Checker</title></head><body><h2>Prime Number Checker</h2><input id="n" type="number"><button onclick="check()">Check</button><p id="result"></p><script>function check(){const n=+document.getElementById("n").value;let prime=n>1;for(let i=2;i*i<=n&&prime;i++)if(n%i===0)prime=false;document.getElementById("result").textContent=prime?"Prime number":"Not a prime number";}</script></body></html>

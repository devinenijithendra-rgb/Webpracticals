<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Fibonacci</title></head><body><h2>Fibonacci Series</h2><input id="n" type="number" min="1"><button onclick="fib()">Generate</button><p id="result"></p><script>function fib(){const n=+document.getElementById("n").value;let a=0,b=1,s=[];for(let i=0;i<n;i++){s.push(a);[a,b]=[b,a+b]}document.getElementById("result").textContent=s.join(", ");}</script></body></html>

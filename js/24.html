<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Array Sorting</title></head><body><h2>Sort Numbers</h2><input id="nums" placeholder="5,2,9,1,7"><button onclick="sortNums()">Sort</button><p id="result"></p><script>function sortNums(){const a=document.getElementById("nums").value.split(",").map(Number).sort((x,y)=>x-y);document.getElementById("result").textContent=a.join(", ");}</script></body></html>

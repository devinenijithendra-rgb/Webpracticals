<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Form Validation</title></head><body><h2>Registration Validation</h2><form onsubmit="return validate()"><input id="name" placeholder="Name"><input id="email" placeholder="Email"><button>Submit</button></form><p id="result"></p><script>function validate(){const n=document.getElementById("name").value.trim(),e=document.getElementById("email").value.trim();if(!n||!/^\S+@\S+\.\S+$/.test(e)){document.getElementById("result").textContent="Please enter a valid name and email.";return false}document.getElementById("result").textContent="Form submitted successfully!";return false;}</script></body></html>

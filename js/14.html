<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Armstrong Number</title></head><body><h2>Armstrong Number</h2><input id="n" type="number"><button onclick="check()">Check</button><p id="result"></p><script>function check(){const n=+document.getElementById("n").value,s=String(Math.abs(n)),p=s.length,sum=[...s].reduce((a,d)=>a+Number(d)**p,0);document.getElementById("result").textContent=sum===n?`${n} is an Armstrong number`:`${n} is not an Armstrong number`;}</script></body></html>

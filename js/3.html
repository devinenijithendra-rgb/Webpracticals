<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Add Two Numbers</title></head><body><h2>Add Two Numbers</h2><input id="a" type="number" placeholder="First number"><input id="b" type="number" placeholder="Second number"><button onclick="add()">Add</button><h3 id="result"></h3><script>function add(){const a=Number(document.getElementById("a").value),b=Number(document.getElementById("b").value);document.getElementById("result").textContent="Sum = "+(a+b);}</script></body></html>

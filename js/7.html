<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Calculator</title></head><body><h2>Simple Calculator</h2><input id="a" type="number"><select id="op"><option>+</option><option>-</option><option>*</option><option>/</option></select><input id="b" type="number"><button onclick="calc()">Calculate</button><p id="result"></p><script>function calc(){const a=+document.getElementById("a").value,b=+document.getElementById("b").value,op=document.getElementById("op").value;let r=op==="+"?a+b:op==="-"?a-b:op==="*"?a*b:b===0?"Cannot divide by zero":a/b;document.getElementById("result").textContent="Result = "+r;}</script></body></html>
